/* 形理书院 4.0 · 沉浸式视觉系统 */
:root{--bg:#f8f9f7;--paper:#fff;--ink:#15241c;--muted:#68756e;--muted2:#87928c;--line:#e7ebe7;--line2:#dfe5df;--jade:#245d4c;--jade-dark:#173f34;--jade-light:#eaf2ec;--gold:#a68862;--gold-soft:#f6f1e7;--shadow:0 18px 52px rgba(26,51,40,.045);--radius:22px;scrollbar-color:#ccd7d0 transparent}
html{scroll-behavior:smooth}body{background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
button,input,select,textarea{font:inherit}button{transition:background-color .18s ease,color .18s ease,transform .18s ease,border-color .18s ease}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #9dbfac;outline-offset:3px}button:not(:disabled):active{transform:scale(.985)}.app-shell{display:block;min-height:100vh}.sidebar{display:none!important}.main-shell{width:100%;min-width:0;margin:0;background:transparent}.topbar{display:none!important}
#main{max-width:1280px;width:calc(100% - 92px);margin:0 auto;min-height:calc(100vh - 190px);padding:42px 0 85px}.main-footer{max-width:1280px;width:calc(100% - 92px);margin:0 auto;padding:25px 0 36px;background:transparent;border-top:1px solid var(--line);font-size:12px;color:#8a9690;display:flex;justify-content:space-between;gap:16px}.main-footer span:last-child{max-width:620px;text-align:right}.view{animation:v4Fade .32s ease}@keyframes v4Fade{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* 顶部全站导航，玻璃材质仅用于交互层 */
.v4-nav{position:sticky;top:0;z-index:80;height:74px;background:rgba(249,250,248,.86);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border-bottom:1px solid rgba(23,48,36,.075)}.v4-nav-inner{max-width:1280px;width:calc(100% - 92px);margin:0 auto;height:100%;display:flex;align-items:center;gap:36px}.v4-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex-shrink:0}.v4-brand:hover{text-decoration:none}.v4-symbol{width:35px;height:35px;border:1px solid #b7c6bc;border-radius:11px;display:grid;place-items:center;background:linear-gradient(160deg,#edf5ed,#fff);color:#1e604b;font:800 24px 'Songti SC','STSong',serif;box-shadow:0 4px 10px #244a3610}.v4-brandcopy{display:flex;flex-direction:column;line-height:1.2;gap:4px}.v4-brandcopy strong{font-size:17px;font-weight:750;letter-spacing:.075em}.v4-brandcopy small{font-size:9px;letter-spacing:.12em;color:#839087}.v4-navlinks{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}.v4-navlink{border:0;background:transparent;padding:11px 16px;border-radius:13px;color:#5f6c64;font-size:13px;font-weight:650;white-space:nowrap}.v4-navlink:hover{background:#ebefeb;color:#233f30}.v4-navlink.active{color:var(--jade);background:#e8efe9}.v4-navright{display:flex;align-items:center;gap:10px}.v4-iconbtn{width:38px;height:38px;border:1px solid #e5eae6;background:#fff;border-radius:50%;color:#405d50;display:grid;place-items:center;font-size:20px}.v4-iconbtn:hover{border-color:#bbcfc2}.v4-progress-pill{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:11px;color:#5f7467;font-weight:700}.v4-progress-dot{width:8px;height:8px;border-radius:50%;background:#4b9873;box-shadow:0 0 0 4px #4b98731c}.v4-mobile-toggle{display:none}.v4-mobile-menu{display:none;position:fixed;top:74px;left:0;right:0;background:#fff;box-shadow:0 22px 34px #0d2b1930;border-bottom:1px solid var(--line);padding:14px 24px 22px;z-index:90}.v4-mobile-menu.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.v4-mobile-menu button{padding:14px 10px;border:0;background:#f5f7f4;border-radius:12px;color:#1d382b;font-weight:650;text-align:left}
/* 通用视觉 */
